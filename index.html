<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C语言术语 中韩对照 | C 언어 용어 중한 대조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --surface-3:#E4E8EF;
  --ink:#15181E; --ink-2:#555C69; --ink-3:#8A91A0;
  --line:#DDE1E8; --line-2:#C5CBD6;
  --accent:#2145B5; --accent-ink:#FFFFFF; --accent-soft:#E6EBF9; --accent-line:#AFBEEC;
  --ok:#1C7345; --ok-soft:#E1F2E8; --bad:#B02E2B; --bad-soft:#FAE4E3;
  --code-kw:#8A2C6A; --code-str:#1B6A3A; --code-cmt:#7A8190; --code-pre:#8B5A0F; --code-num:#1F4FC4;
  --shadow:0 1px 2px rgba(21,24,30,.06),0 8px 24px -12px rgba(21,24,30,.18);
  --sans:"IBM Plex Sans KR","Noto Sans SC",-apple-system,"Segoe UI","PingFang SC","Apple SD Gothic Neo","Malgun Gothic","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218; --surface:#161A22; --surface-2:#1E232D; --surface-3:#28303C;
    --ink:#E8EBF1; --ink-2:#A6AEBC; --ink-3:#737C8C;
    --line:#2A3140; --line-2:#3A4353;
    --accent:#8AA5F5; --accent-ink:#0F1218; --accent-soft:#1D2A4E; --accent-line:#33468A;
    --ok:#5FCB8A; --ok-soft:#173226; --bad:#F08B86; --bad-soft:#3F1F1E;
    --code-kw:#E093C6; --code-str:#8FD9A8; --code-cmt:#7C8596; --code-pre:#E6B96B; --code-num:#9DB8F7;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#161A22; --surface-2:#1E232D; --surface-3:#28303C;
  --ink:#E8EBF1; --ink-2:#A6AEBC; --ink-3:#737C8C;
  --line:#2A3140; --line-2:#3A4353;
  --accent:#8AA5F5; --accent-ink:#0F1218; --accent-soft:#1D2A4E; --accent-line:#33468A;
  --ok:#5FCB8A; --ok-soft:#173226; --bad:#F08B86; --bad-soft:#3F1F1E;
  --code-kw:#E093C6; --code-str:#8FD9A8; --code-cmt:#7C8596; --code-pre:#E6B96B; --code-num:#9DB8F7;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;font-feature-settings:"ss01"}
[lang="zh-Hans"]{font-family:"Noto Sans SC","IBM Plex Sans KR","PingFang SC","Microsoft YaHei",sans-serif}
[lang="ko"]{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
code,pre,kbd,.mono{font-family:var(--mono)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r)}
.hidden{display:none!important}
img{max-width:100%}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:20px}
.brand{font-family:var(--mono);font-weight:500;font-size:16px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand b{font-weight:500;color:var(--accent)}
.nav{display:flex;gap:4px;height:100%;margin-left:8px}
.nav button{position:relative;padding:0 12px;height:100%;color:var(--ink-2);font-weight:500;font-size:15px;border-radius:0}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);padding:2px;background:var(--surface)}
.seg button{padding:4px 11px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink-2);line-height:1.4}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.small button{padding:3px 9px;font-size:13px}
.theme-btn{width:34px;height:34px;border:1px solid var(--line-2);border-radius:var(--r);display:inline-grid;place-items:center;color:var(--ink-2);background:var(--surface)}
.theme-btn:hover{color:var(--ink)}

/* mobile nav becomes bottom tabs */
@media (max-width:720px){
  .top-in{height:54px;gap:12px}
  .nav{display:none}
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{padding:10px 4px 9px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-top:2px solid transparent;border-radius:0}
  .tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
  main{padding-bottom:72px}
}
@media (min-width:721px){ .tabs{display:none} }

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:0 20px 64px}
.view{display:none}
.view.on{display:block}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.015em}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14.5px;line-height:1.3;white-space:nowrap;transition:transform .08s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start;padding:44px 0 36px}
.hero h1{font-size:clamp(28px,3.6vw,38px);font-weight:600}
.hero .lead{margin-top:14px;font-size:16.5px;color:var(--ink-2);max-width:44ch}
.hero .cta{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.hero .stats{margin-top:28px;display:flex;gap:28px;font-size:13.5px;color:var(--ink-2)}
.hero .stats strong{display:block;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
.demo{box-shadow:var(--shadow);overflow:hidden}
.demo pre{margin:0;padding:18px 20px;font-size:13.5px;line-height:1.7;overflow-x:auto;tab-size:4}
.demo pre code{display:block;min-width:max-content}
.ln{display:inline-block;width:2ch;margin-right:1.5ch;color:var(--ink-3);text-align:right;user-select:none}
.tk{border-bottom:1.5px dotted var(--accent);color:inherit;cursor:pointer;border-radius:3px;padding:0 1px;transition:background .12s}
.tk:hover,.tk.on{background:var(--accent-soft);border-bottom-style:solid}
.reader{border-top:1px solid var(--line);padding:14px 20px 16px;min-height:92px;background:var(--surface-2)}
.reader .r-terms{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.reader .r-terms span{font-size:18px;font-weight:600;letter-spacing:-.01em}
.reader .r-terms .r-en{font-family:var(--mono);font-weight:400;font-size:14px;color:var(--ink-2)}
.reader .r-desc{margin-top:6px;font-size:14px;color:var(--ink-2)}
.reader .r-hint{font-size:14px;color:var(--ink-3)}
.reader .r-link{margin-top:8px;font-size:13.5px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:24px;padding:28px 0 24px}
  .hero .lead{max-width:none}
}

/* ---------- glossary ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 0 4px;position:sticky;top:60px;z-index:5;background:var(--bg)}
@media (max-width:720px){ .toolbar{top:54px} }
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:42px;padding:0 40px 0 40px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:13px;color:var(--ink-3)}
.search .clear{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:6px;color:var(--ink-3);display:none;place-items:center}
.search .clear.show{display:grid}
.search .clear:hover{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;max-width:100%}
@media (max-width:720px){ .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} }
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);line-height:1.4}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{margin-left:5px;font-family:var(--mono);font-size:12px;opacity:.7}

.list-head{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,1fr) 92px 28px;gap:16px;padding:14px 12px 8px;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.list-head span:nth-child(4),.list-head span:nth-child(5){text-align:right}
.count{padding:16px 0 0;font-size:13.5px;color:var(--ink-2)}
.row{border-bottom:1px solid var(--line)}
.row-head{width:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,1fr) 92px 28px;gap:16px;align-items:center;padding:13px 12px;text-align:left;border-radius:0}
.row-head:hover{background:var(--surface)}
.row-head .c-zh,.row-head .c-ko{font-weight:500;font-size:16.5px;overflow-wrap:anywhere}
.row-head .c-en{font-family:var(--mono);font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.row-head .c-cat{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.row-head .chev{justify-self:end;width:18px;height:18px;color:var(--ink-3);transition:transform .18s}
.row.open .row-head{background:var(--surface)}
.row.open .chev{transform:rotate(180deg)}
.row.starred .c-zh::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 8px 3px 0}
.row-body{padding:2px 12px 20px;background:var(--surface)}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.def{padding-top:12px;border-top:1px solid var(--line)}
.def .lab{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.def .txt{font-size:15px;color:var(--ink);max-width:60ch}
.example{margin-top:16px}
.example .lab{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
pre.code{margin:0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);font-size:13px;line-height:1.65;overflow-x:auto;tab-size:4}
pre.code code{display:block;min-width:max-content}
.kw{color:var(--code-kw)} .st{color:var(--code-str)} .cm{color:var(--code-cmt)} .pp{color:var(--code-pre)} .nu{color:var(--code-num)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px;font-size:13.5px}
.row-actions .rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linkchip{padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500;text-decoration:none}
.linkchip:hover{filter:brightness(.96)}
.star-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500}
.star-btn:hover{color:var(--ink)}
.star-btn.on{color:var(--accent)}
.empty{padding:56px 0;text-align:center;color:var(--ink-2)}
@media (max-width:720px){
  .list-head{display:none}
  .row-head{grid-template-columns:1fr 1fr 24px;grid-template-areas:"zh ko chev" "en en chev";gap:4px 12px;padding:12px 8px}
  .row-head .c-zh{grid-area:zh}.row-head .c-ko{grid-area:ko}.row-head .c-en{grid-area:en}.row-head .chev{grid-area:chev;align-self:center}
  .row-head .c-cat{display:none}
  .row-body{padding:2px 8px 18px}
  .defs{grid-template-columns:1fr;gap:12px}
}

/* ---------- flashcards ---------- */
.stage{max-width:600px;margin:0 auto;padding:28px 0 0}
.stage-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.progress{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin:14px 0 20px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.card{min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 28px;position:relative;box-shadow:var(--shadow);transition:transform .16s}
.card.flip{animation:flipin .28s ease}
@keyframes flipin{from{transform:rotateX(70deg);opacity:0}to{transform:none;opacity:1}}
.card .face-lab{position:absolute;top:14px;left:16px;font-size:12.5px;color:var(--ink-3)}
.card .big{font-size:clamp(30px,6vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1.2}
.card .sub{margin-top:12px;font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.card .desc{margin-top:16px;font-size:15px;color:var(--ink-2);max-width:44ch}
.card .tap{margin-top:22px;font-size:13.5px;color:var(--ink-3)}
.card-actions{display:flex;gap:10px;justify-content:center;margin-top:18px}
.card-actions .btn{min-width:130px;padding:11px 18px}
.meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-top:14px}
.done{padding:36px 24px;text-align:center}
.done h2{margin-bottom:8px}
.done .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
select{height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
@media (prefers-reduced-motion:reduce){ .card.flip{animation:none} .tk,.chev,.progress i,.btn{transition:none} }

/* ---------- knowledge ---------- */
.kn{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding-top:28px}
.kn-list{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.kn-list button{text-align:left;padding:9px 12px;border-radius:var(--r);color:var(--ink-2);font-size:14.5px;line-height:1.35}
.kn-list button:hover{background:var(--surface);color:var(--ink)}
.kn-list button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--accent)}
.kn-list button small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400}
.article h2{font-size:26px;margin-bottom:4px}
.article .h2-sub{font-size:16px;color:var(--ink-2);margin-bottom:22px}
.para{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;padding:14px 0;border-top:1px solid var(--line)}
.para p{font-size:15px;max-width:52ch}
.para p.sec{color:var(--ink-2)}
.para-head{display:grid;grid-template-columns:1fr 1fr;gap:28px;font-size:12.5px;color:var(--ink-3);padding-bottom:4px}
.article pre.code{margin:20px 0 6px}
.article .rel{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--ink-2);font-size:12.5px}
.tbl td:first-child{font-family:var(--mono);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.kn-select{display:none}
@media (max-width:820px){
  .kn{grid-template-columns:1fr;gap:16px;padding-top:20px}
  .kn-list{display:none}
  .kn-select{display:block;width:100%}
  .para{grid-template-columns:1fr;gap:8px}
  .para-head{display:none}
  .para p.sec::before{content:attr(data-lab);display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
  .para p.pri::before{content:attr(data-lab);display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
}

/* ---------- quiz ---------- */
.quiz{max-width:640px;margin:0 auto;padding:28px 0 0}
.q-intro{padding:36px 28px;text-align:center}
.q-intro h2{margin-bottom:8px}
.q-intro .opts{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-items:center;margin:22px 0 26px}
.q-head{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
.q-card{padding:26px 26px 22px}
.q-card .prompt{font-size:15px;color:var(--ink-2)}
.q-card .term{font-size:clamp(28px,5vw,36px);font-weight:600;letter-spacing:-.02em;margin:6px 0 20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:16px;font-weight:500;margin-top:8px;transition:transform .08s}
.opt:hover{border-color:var(--ink-3)}
.opt:active{transform:translateY(1px)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.correct):not(.wrong){opacity:.55}
.feedback{margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:14.5px}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.badf{background:var(--bad-soft);color:var(--bad)}
.q-foot{display:flex;justify-content:flex-end;margin-top:16px}
.result{padding:36px 28px;text-align:center}
.result .score{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;margin:8px 0 4px}
.result .review{text-align:left;margin-top:26px;border-top:1px solid var(--line)}
.result .review h3{margin:16px 0 6px;font-size:14.5px;color:var(--ink-2);font-weight:500}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.rv .a{color:var(--ok)}.rv .w{color:var(--bad);text-decoration:line-through;margin-right:8px}

/* ---------- footer ---------- */

/* ---- C syntax highlighting ---- */
const KW = 'auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while _Bool bool true false NULL EOF FILE size_t';
const TOK = new RegExp('(//.*$)|(/\\*.*?\\*/)|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')|\\b(' + KW.split(' ').join('|') + ')\\b|(\\b\\d+(?:\\.\\d+)?[a-zA-Z]*\\b)', 'g');
function hlLine(line){
  if (/^\s*#/.test(line)) return '<span class="pp">' + escC(line) + '</span>';
  if ((/^\s*\/\*/.test(line) && !line.includes('*/')) || (/\*\/\s*$/.test(line) && !line.includes('/*'))) return '<span class="cm">' + escC(line) + '</span>';
  let out = '', last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(line))) {
    out += escC(line.slice(last, m.index));
    const t = escC(m[0]);
    out += (m[1] || m[2]) ? '<span class="cm">' + t + '</span>'
         : m[3] ? '<span class="st">' + t + '</span>'
         : m[4] ? '<span class="kw">' + t + '</span>'
         : '<span class="nu">' + t + '</span>';
    last = m.index + m[0].length;
  }
  return out + escC(line.slice(last));
}
const codeBlock = lines => '<pre class="code"><code>' + lines.map(hlLine).join('\n') + '</code></pre>';

/* ---- navigation ---- */
const VIEWS = ['glossary', 'flash', 'know', 'quiz'];
function renderNav(){
  const html = VIEWS.map((v, i) => `<button data-view="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${L().nav[i]}</button>`).join('');
  $('#nav').innerHTML = html; $('#tabs').innerHTML = html;
}
function setView(v){
  S.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'v-' + v));
  renderNav();
  if (v === 'flash') renderFlash();
  if (v === 'know') renderKnow();
  if (v === 'quiz') renderQuiz();
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (b) setView(b.dataset.view);
});

/* ---- header controls ---- */
function setUI(lang){
  S.ui = lang; store.set('ui', lang);
  document.documentElement.lang = langAttr(lang);
  document.querySelectorAll('#uiSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ui === lang)));
  renderAll();
}
$('#uiSeg').addEventListener('click', e => { const b = e.target.closest('[data-ui]'); if (b) setUI(b.dataset.ui); });
function applyTheme(){
  const t = store.get('theme', null);
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  store.set('theme', cur === 'dark' ? 'light' : 'dark'); applyTheme();
});

/* ---- hero ---- */
function renderHero(){
  const s = L();
  const code = HERO.map((segs, n) => {
    const body = segs.map(sg => typeof sg === 'string' ? hlLine(sg)
      : `<span class="tk${S.pinned === sg.t ? ' on' : ''}" data-t="${sg.t}" tabindex="0" role="button">${hlLine(sg.s)}</span>`).join('');
    return `<span class="ln">${n + 1}</span>${body}`;
  }).join('\n');
  $('#hero').innerHTML = `
    <div>
      <h1 id="hero-h1">${s.heroH}</h1>
      <p class="lead">${s.heroP}</p>
      <div class="cta">
        <button class="btn primary" data-view="flash">${s.heroCta}</button>
        <button class="btn" data-view="know">${s.heroCta2}</button>
      </div>
      <div class="stats">
        <div><strong>${TERMS.length}</strong>${s.statTerms}</div>
        <div><strong>${CATS.length}</strong>${s.statCats}</div>
        <div><strong>${TOPICS.length}</strong>${s.statTopics}</div>
      </div>
    </div>
    <div class="panel demo">
      <pre><code id="heroCode">${code}</code></pre>
      <div class="reader" id="reader"></div>
    </div>`;
  renderReader(S.pinned);
  const hc = $('#heroCode');
  hc.addEventListener('mouseover', e => { const t = e.target.closest('.tk'); if (t && !S.pinned) renderReader(t.dataset.t); });
  hc.addEventListener('focusin', e => { const t = e.target.closest('.tk'); if (t && !S.pinned) renderReader(t.dataset.t); });
  const pin = e => {
    const t = e.target.closest('.tk'); if (!t) return;
    S.pinned = S.pinned === t.dataset.t ? null : t.dataset.t;
    hc.querySelectorAll('.tk').forEach(x => x.classList.toggle('on', x.dataset.t === S.pinned));
    renderReader(t.dataset.t);
  };
  hc.addEventListener('click', pin);
  hc.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pin(e); } });
}
function renderReader(id){
  const r = $('#reader'), s = L();
  if (!id || !TMAP[id]) { r.innerHTML = `<p class="r-hint">${s.readerHint}</p>`; return; }
  const t = TMAP[id], pri = S.ui, sec = other();
  r.innerHTML = `
    <div class="r-terms">
      <span lang="${langAttr(pri)}">${esc(term(t, pri))}</span>
      <span lang="${langAttr(sec)}">${esc(term(t, sec))}</span>
      <span class="r-en">${esc(t.e)}</span>
    </div>
    <p class="r-desc" lang="${langAttr(pri)}">${esc(desc(t, pri))}</p>
    <p class="r-link"><a href="#" data-term="${t.i}">${s.readerLink}</a></p>`;
}

/* ---- glossary ---- */
function renderChips(){
  const s = L();
  const counts = {}; TERMS.forEach(t => counts[t.c] = (counts[t.c] || 0) + 1);
  const chip = (id, label, n) => `<button class="chip" data-cat="${id}" aria-pressed="${S.cat === id}">${label}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
  $('#chips').innerHTML = chip('all', s.all, TERMS.length) + chip('starred', s.starred, S.starred.size) + CATS.map(c => chip(c.i, catName(c), counts[c.i])).join('');
}
function filtered(){
  const q = S.q.trim().toLowerCase().replace(/\s+/g, '');
  return TERMS.filter(t => {
    if (S.cat === 'starred' && !S.starred.has(t.i)) return false;
    if (S.cat !== 'all' && S.cat !== 'starred' && t.c !== S.cat) return false;
    if (!q) return true;
    const hay = [t.z, t.k, t.e, t.dz, t.dk, ...(t.x || [])].join(' ').toLowerCase().replace(/\s+/g, '');
    return hay.includes(q);
  });
}
function renderList(){
  const s = L(), items = filtered();
  $('#count').textContent = s.count(items.length);
  $('#listHead').innerHTML = `<span>${s.colZh}</span><span>${s.colKo}</span><span>${s.colEn}</span><span>${s.colCat}</span><span></span>`;
  $('#listHead').style.display = items.length ? '' : 'none';
  if (!items.length) { $('#list').innerHTML = `<div class="empty">${s.empty}</div>`; return; }
  $('#list').innerHTML = items.map(t => {
    const open = S.open.has(t.i);
    return `<div class="row${open ? ' open' : ''}${S.starred.has(t.i) ? ' starred' : ''}" id="row-${t.i}" data-id="${t.i}">
      <button class="row-head" aria-expanded="${open}" aria-controls="body-${t.i}">
        <span class="c-zh" lang="zh-Hans">${esc(t.z)}</span>
        <span class="c-ko" lang="ko">${esc(t.k)}</span>
        <span class="c-en">${esc(t.e)}</span>
        <span class="c-cat">${catName(CMAP[t.c])}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="row-body" id="body-${t.i}" ${open ? '' : 'hidden'}>${open ? rowBody(t) : ''}</div>
    </div>`;
  }).join('');
}
function rowBody(t){
  const s = L(), pri = S.ui, sec = other();
  const def = l => `<div class="def"><div class="lab">${l === 'zh' ? s.labZh : s.labKo}</div><p class="txt" lang="${langAttr(l)}">${esc(desc(t, l))}</p></div>`;
  const rel = TOPICS.filter(tp => tp.terms.includes(t.i));
  return `
    <div class="defs">${def(pri)}${def(sec)}</div>
    ${t.x ? `<div class="example"><div class="lab">${s.example}</div>${codeBlock(t.x)}</div>` : ''}
    <div class="row-actions">
      <button class="star-btn${S.starred.has(t.i) ? ' on' : ''}" data-star="${t.i}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="${S.starred.has(t.i) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.5 1.2 6.4L12 17.5 6.3 20.6l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>
        ${S.starred.has(t.i) ? s.unstar : s.star}</button>
      ${S.known.has(t.i) ? `<span class="faint">${s.knownTag}</span>` : ''}
      ${rel.length ? `<span class="rel"><span class="muted">${s.related}</span>${rel.map(tp => `<button class="linkchip" data-topic="${tp.i}">${esc(S.ui === 'zh' ? tp.t.z : tp.t.k)}</button>`).join('')}</span>` : ''}
    </div>`;
}
function toggleRow(id){
  if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
  const row = document.getElementById('row-' + id); if (!row) { renderList(); return; }
  const open = S.open.has(id), body = row.querySelector('.row-body');
  row.classList.toggle('open', open);
  row.querySelector('.row-head').setAttribute('aria-expanded', String(open));
  if (open) { body.innerHTML = rowBody(TMAP[id]); body.hidden = false; } else { body.hidden = true; body.innerHTML = ''; }
}
function gotoTerm(id){
  S.cat = 'all'; S.q = ''; $('#q').value = ''; $('#qClear').classList.remove('show');
  S.open.add(id); setView('glossary'); renderChips(); renderList();
  const row = document.getElementById('row-' + id);
  if (row) { requestAnimationFrame(() => { row.scrollIntoView({ block: 'start' }); window.scrollBy(0, -120); row.querySelector('.row-head').focus({ preventScroll: true }); }); }
}
$('#list').addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st) {
    const id = st.dataset.star;
    if (S.starred.has(id)) S.starred.delete(id); else S.starred.add(id);
    save(); renderChips();
    const row = document.getElementById('row-' + id);
    row.classList.toggle('starred', S.starred.has(id));
    row.querySelector('.row-body').innerHTML = rowBody(TMAP[id]);
    if (S.cat === 'starred') renderList();
    return;
  }
  const tp = e.target.closest('[data-topic]');
  if (tp) { S.topic = tp.dataset.topic; setView('know'); return; }
  const h = e.target.closest('.row-head');
  if (h) toggleRow(h.closest('.row').dataset.id);
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-term]');
  if (a) { e.preventDefault(); gotoTerm(a.dataset.term); }
});
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]'); if (!c) return;
  S.cat = c.dataset.cat; renderChips(); renderList();
});
$('#q').addEventListener('input', e => { S.q = e.target.value; $('#qClear').classList.toggle('show', !!S.q); renderList(); });
$('#qClear').addEventListener('click', () => { S.q = ''; $('#q').value = ''; $('#qClear').classList.remove('show'); renderList(); $('#q').focus(); });

/* ---- flashcards ---- */
function buildDeck(){
  let pool = TERMS.filter(t => S.fcCat === 'all' || t.c === S.fcCat);
  if (S.fcSkip) pool = pool.filter(t => !S.known.has(t.i));
  S.fc = { deck: shuffle(pool.map(t => t.i)), i: 0, flipped: false, got: [], again: [] };
}
function dirLabel(d){ return d === 'zh>ko' ? L().dirZK : L().dirKZ; }
function dirSeg(cur, attr){
  const opts = S.ui === 'ko' ? ['ko>zh', 'zh>ko'] : ['zh>ko', 'ko>zh'];
  return `<div class="seg small" role="group">${opts.map(d => `<button data-${attr}="${d}" aria-pressed="${cur === d}">${dirLabel(d)}</button>`).join('')}</div>`;
}
function catSelect(cur, attr){
  return `<select data-${attr} aria-label="${L().fcCat}"><option value="all">${L().all}</option>${CATS.map(c => `<option value="${c.i}" ${cur === c.i ? 'selected' : ''}>${catName(c)}</option>`).join('')}</select>`;
}
function renderFlash(){
  const s = L(); if (!S.fc) buildDeck();
  const fc = S.fc, [from, to] = S.fcDir.split('>');
  const total = fc.deck.length, done = fc.i;
  let body;
  if (!total) {
    body = `<div class="panel done"><h2>${s.fcAllKnown}</h2><div class="btns"><button class="btn primary" data-fc="include">${s.includeKnown}</button><button class="btn ghost" data-fc="reset">${s.resetProg}</button></div></div>`;
  } else if (fc.i >= total) {
    body = `<div class="panel done"><h2>${s.fcDone}</h2><p class="muted">${s.fcDoneP(fc.got.length, fc.again.length)}</p>
      <div class="btns">${fc.again.length ? `<button class="btn primary" data-fc="review">${s.reviewAgain}</button>` : ''}<button class="btn" data-fc="restart">${s.restart}</button></div></div>`;
  } else {
    const t = TMAP[fc.deck[fc.i]];
    const front = `<div class="face-lab">${s.front}</div><div class="big" lang="${langAttr(from)}">${esc(term(t, from))}</div><div class="tap">${s.tapHint}</div>`;
    const back = `<div class="face-lab">${s.back}</div><div class="big" lang="${langAttr(to)}">${esc(term(t, to))}</div><div class="sub">${esc(t.e)}</div><p class="desc" lang="${langAttr(S.ui)}">${esc(desc(t, S.ui))}</p>`;
    body = `<div class="panel card${fc.flipped ? ' flip' : ''}" id="fcCard" tabindex="0" role="button" aria-label="${s.flip}">${fc.flipped ? back : front}</div>
      <div class="card-actions">${fc.flipped
        ? `<button class="btn bad" data-fc="again">${s.again}</button><button class="btn ok" data-fc="got">${s.got}</button>`
        : `<button class="btn primary" data-fc="flip">${s.flip}</button>`}</div>
      <div class="meta"><span>${s.round} ${done + 1} / ${total}</span><span>${s.mastered} ${S.known.size} / ${TERMS.length}</span></div>`;
  }
  $('#flash').innerHTML = `
    <div class="stage-top"><h2>${s.fcTitle}</h2><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${dirSeg(S.fcDir, 'fcdir')}${catSelect(S.fcCat, 'fccat')}
      <label class="check"><input type="checkbox" data-fcskip ${S.fcSkip ? 'checked' : ''}>${s.fcSkip}</label></div></div>
    <div class="progress"><i style="width:${total ? Math.min(100, done / total * 100) : 0}%"></i></div>
    ${body}
    ${total && fc.i < total ? `<p class="small faint" style="text-align:center;margin-top:18px"><button class="btn ghost" data-fc="reset" style="font-size:13px">${s.resetProg}</button></p>` : ''}`;
}
$('#flash').addEventListener('click', e => {
  const d = e.target.closest('[data-fcdir]'); if (d) { S.fcDir = d.dataset.fcdir; store.set('fcDir', S.fcDir); S.fc.flipped = false; renderFlash(); return; }
  const a = e.target.closest('[data-fc]');
  const act = a ? a.dataset.fc : (e.target.closest('#fcCard') ? 'flip' : null);
  if (!act) return;
  fcAction(act);
});
$('#flash').addEventListener('change', e => {
  if (e.target.matches('[data-fccat]')) { S.fcCat = e.target.value; buildDeck(); renderFlash(); }
  if (e.target.matches('[data-fcskip]')) { S.fcSkip = e.target.checked; buildDeck(); renderFlash(); }
});
function fcAction(act){
  const fc = S.fc;
  if (act === 'flip') { fc.flipped = !fc.flipped; renderFlash(); return; }
  if (act === 'got' || act === 'again') {
    const id = fc.deck[fc.i];
    if (act === 'got') { S.known.add(id); fc.got.push(id); } else { S.known.delete(id); fc.again.push(id); }
    save(); fc.i++; fc.flipped = false; renderFlash(); return;
  }
  if (act === 'restart') { buildDeck(); renderFlash(); return; }
  if (act === 'review') { S.fc = { deck: shuffle([...fc.again]), i: 0, flipped: false, got: [], again: [] }; renderFlash(); return; }
  if (act === 'include') { S.fcSkip = false; buildDeck(); renderFlash(); return; }
  if (act === 'reset') { S.known.clear(); save(); buildDeck(); renderFlash(); return; }
}
document.addEventListener('keydown', e => {
  if (S.view !== 'flash' || !S.fc || e.target.matches('input,select,textarea')) return;
  if (S.fc.i >= S.fc.deck.length) return;
  if (e.key === ' ' || e.key === 'Enter') { if (!e.target.closest('button') || e.target.id === 'fcCard') { e.preventDefault(); fcAction('flip'); } }
  else if (S.fc.flipped && e.key === '1') fcAction('again');
  else if (S.fc.flipped && e.key === '2') fcAction('got');
});

/* ---- knowledge ---- */
function renderKnow(){
  const s = L(), pri = S.ui, sec = other();
  const tp = TOPICS.find(t => t.i === S.topic) || TOPICS[0];
  const tl = (t, l) => l === 'zh' ? t.t.z : t.t.k, sl = (t, l) => l === 'zh' ? t.s.z : t.s.k;
  const list = TOPICS.map(t => `<button data-tp="${t.i}" ${t.i === tp.i ? 'aria-current="true"' : ''}>${esc(tl(t, pri))}<small lang="${langAttr(sec)}">${esc(tl(t, sec))}</small></button>`).join('');
  const sel = `<select class="kn-select" data-tpsel>${TOPICS.map(t => `<option value="${t.i}" ${t.i === tp.i ? 'selected' : ''}>${esc(tl(t, pri))}</option>`).join('')}</select>`;
  const lab = l => l === 'zh' ? s.colZh : s.colKo;
  const paras = tp.p.map(p => `<div class="para">
      <p class="pri" lang="${langAttr(pri)}" data-lab="${lab(pri)}">${esc(pri === 'zh' ? p.z : p.k)}</p>
      <p class="sec" lang="${langAttr(sec)}" data-lab="${lab(sec)}">${esc(sec === 'zh' ? p.z : p.k)}</p></div>`).join('');
  let tbl = '';
  if (tp.tbl) {
    const h = pri === 'zh' ? tp.tbl.h.z : tp.tbl.h.k;
    tbl = `<div class="tbl-wrap"><table class="tbl"><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${tp.tbl.r.map(r => `<tr><td>${esc(r[0])}</td><td class="mono">${esc(r[1])}</td><td lang="${langAttr(pri)}">${esc(pri === 'zh' ? r[2].z : r[2].k)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const rel = tp.terms.map(id => TMAP[id]).filter(Boolean).map(t => `<a href="#" class="linkchip" data-term="${t.i}">${esc(term(t, pri))}</a>`).join('');
  $('#know').innerHTML = `
    <div class="kn-list">${list}</div>
    <div class="article">
      ${sel}
      <h2 lang="${langAttr(pri)}">${esc(tl(tp, pri))}</h2>
      <p class="h2-sub" lang="${langAttr(sec)}">${esc(tl(tp, sec))}</p>
      <div class="para-head"><span>${lab(pri)}</span><span>${lab(sec)}</span></div>
      ${paras}
      ${tp.x ? codeBlock(tp.x) : ''}
      ${tbl}
      <div class="rel"><span>${s.relTerms}</span>${rel}</div>
    </div>`;
}
$('#know').addEventListener('click', e => { const b = e.target.closest('[data-tp]'); if (b) { S.topic = b.dataset.tp; renderKnow(); window.scrollTo({ top: 0 }); } });
$('#know').addEventListener('change', e => { if (e.target.matches('[data-tpsel]')) { S.topic = e.target.value; renderKnow(); } });

/* ---- quiz ---- */
function buildQuiz(){
  const pick = shuffle([...TERMS]).slice(0, S.qzN);
  const [from, to] = S.qzDir.split('>');
  const qs = pick.map(t => {
    const same = TERMS.filter(x => x.i !== t.i && x.c === t.c && term(x, to) !== term(t, to));
    const rest = TERMS.filter(x => x.i !== t.i && x.c !== t.c);
    const d = shuffle(same).slice(0, 3);
    while (d.length < 3) d.push(shuffle(rest).find(x => !d.includes(x)));
    return { id: t.i, opts: shuffle([t.i, ...d.map(x => x.i)]) };
  });
  S.qz = { qs, i: 0, picked: null, answers: [] };
}
function renderQuiz(){
  const s = L(), qz = S.qz;
  let html;
  if (!qz) {
    html = `<div class="panel q-intro"><h2>${s.qzTitle}</h2><p class="muted">${s.qzP}</p>
      <div class="opts">${dirSeg(S.qzDir, 'qzdir')}<label class="check">${s.qzN}<select data-qzn>${[10, 20, 30].map(n => `<option value="${n}" ${S.qzN === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <button class="btn primary" data-qz="start">${s.qzStart}</button></div>`;
  } else if (qz.i >= qz.qs.length) {
    const c = qz.answers.filter(a => a.ok).length, wrong = qz.answers.filter(a => !a.ok);
    const [from, to] = S.qzDir.split('>');
    html = `<div class="panel result"><p class="muted">${s.score(c, qz.qs.length)}</p><div class="score">${c} / ${qz.qs.length}</div>
      ${wrong.length ? `<div class="review"><h3>${s.review}</h3>${wrong.map(a => `<div class="rv"><span lang="${langAttr(from)}">${esc(term(TMAP[a.id], from))}</span><span><span class="w" lang="${langAttr(to)}">${esc(term(TMAP[a.picked], to))}</span><span class="a" lang="${langAttr(to)}">${esc(term(TMAP[a.id], to))}</span></span></div>`).join('')}</div>` : `<p>${s.perfect}</p>`}
      <div style="margin-top:24px"><button class="btn primary" data-qz="retry">${s.retry}</button></div></div>`;
  } else {
    const q = qz.qs[qz.i], t = TMAP[q.id], [from, to] = S.qzDir.split('>');
    const ask = to === 'ko' ? s.qAskKo(term(t, from)) : s.qAskZh(term(t, from));
    const opts = q.opts.map((id, k) => {
      let cls = 'opt';
      if (qz.picked) { if (id === q.id) cls += ' correct'; else if (id === qz.picked) cls += ' wrong'; }
      return `<button class="${cls}" data-opt="${id}" ${qz.picked ? 'disabled' : ''}><span class="k">${String.fromCharCode(65 + k)}</span><span lang="${langAttr(to)}">${esc(term(TMAP[id], to))}</span></button>`;
    }).join('');
    const fb = qz.picked ? (qz.picked === q.id
      ? `<div class="feedback good">${s.correct} <span class="mono">${esc(t.e)}</span></div>`
      : `<div class="feedback badf">${s.wrong} <strong lang="${langAttr(to)}">${esc(term(t, to))}</strong> <span class="mono">${esc(t.e)}</span></div>`) : '';
    const last = qz.i === qz.qs.length - 1;
    html = `<div class="q-head"><span>${s.qNo(qz.i + 1, qz.qs.length)}</span><span>${dirLabel(S.qzDir)}</span></div>
      <div class="panel q-card"><p class="prompt">${ask}</p>${opts}${fb}
      ${qz.picked ? `<div class="q-foot"><button class="btn primary" data-qz="next">${last ? s.finish : s.next}</button></div>` : ''}</div>`;
  }
  $('#quiz').innerHTML = html;
  if (qz && qz.picked) { const b = $('#quiz [data-qz="next"]'); if (b) b.focus(); }
}
$('#quiz').addEventListener('click', e => {
  const d = e.target.closest('[data-qzdir]'); if (d) { S.qzDir = d.dataset.qzdir; renderQuiz(); return; }
  const o = e.target.closest('[data-opt]');
  if (o && !S.qz.picked) { S.qz.picked = o.dataset.opt; S.qz.answers.push({ id: S.qz.qs[S.qz.i].id, picked: S.qz.picked, ok: S.qz.picked === S.qz.qs[S.qz.i].id }); renderQuiz(); return; }
  const a = e.target.closest('[data-qz]'); if (!a) return;
  if (a.dataset.qz === 'start') { buildQuiz(); renderQuiz(); }
  else if (a.dataset.qz === 'next') { S.qz.i++; S.qz.picked = null; renderQuiz(); }
  else if (a.dataset.qz === 'retry') { S.qz = null; renderQuiz(); }
});
$('#quiz').addEventListener('change', e => { if (e.target.matches('[data-qzn]')) S.qzN = +e.target.value; });
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || !S.qz || S.qz.i >= S.qz.qs.length || e.target.matches('input,select,textarea')) return;
  const k = e.key.toUpperCase();
  if (!S.qz.picked && 'ABCD'.includes(k) && k.length === 1) { const b = $(`#quiz .opt:nth-of-type(${'ABCD'.indexOf(k) + 1})`); if (b) b.click(); }
});

/* ---- boot ---- */
function renderAll(){
  const s = L();
  $('#q').placeholder = s.search; $('#q').setAttribute('aria-label', s.search);
  $('#foot').innerHTML = `<span>${s.footL}</span><span>${s.footR}</span>`;
  renderNav(); renderHero(); renderChips(); renderList();
  if (S.view === 'flash') renderFlash();
  if (S.view === 'know') renderKnow();
  if (S.view === 'quiz') renderQuiz();
}
applyTheme();
document.documentElement.lang = langAttr(S.ui);
document.querySelectorAll('#uiSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ui === S.ui)));
renderAll();
</script>
</body>
</html>
